        let i = 0;

        const width = window.innerWidth;
        const height = window.innerHeight;
        const margin = {top: 20, right: 120, bottom: 20, left: 120};

        const svg = d3.select("#canvas")
            .attr("width", width)
            .attr("height", height)
            .call(d3.zoom().on("zoom", (event) => {
                g.attr("transform", event.transform);
            }))
            .append("g");

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left}, ${margin.top})`);

        const tree = d3.tree().nodeSize([30, 200]);
        let root = d3.hierarchy(data, d => d.children);

        root.x0 = height / 2;
        root.y0 = 0;

        // Function to collapse nodes
        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }

        // Initially collapse all except root
        if (root.children) {
            root.children.forEach(collapse);
        }

        update(root);

        function update(source) {
            const nodes = root.descendants().reverse();
            const links = root.links();

            tree(root);

            let left = root;
            let right = root;
            root.eachBefore(node => {
                if (node.x < left.x) left = node;
                if (node.x > right.x) right = node;
            });

            const transition = svg.transition().duration(750);

            const node = g.selectAll("g.node")
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${source.y0}, ${source.x0})`)
                .on("click", (event, d) => {
                    if (d.children) {
                        d._children = d.children;
                        d.children = null;
                    } else {
                        d.children = d._children;
                        d._children = null;
                    }
                    update(d);
                });

            nodeEnter.append("circle")
                .attr("r", 1e-6)
                .style("fill", d => d._children ? "#3498db" : "#fff");

            nodeEnter.append("text")
                .attr("dy", ".35em")
                .attr("x", d => d._children || d.children ? -13 : 13)
                .attr("text-anchor", d => d._children || d.children ? "end" : "start")
                .text(d => d.data.name);

            const nodeUpdate = node.merge(nodeEnter).transition(transition)
                .attr("transform", d => `translate(${d.y}, ${d.x})`);

            nodeUpdate.select("circle")
                .attr("r", 6)
                .style("fill", d => d._children ? "#3498db" : "#fff");

            nodeUpdate.select("text")
                .style("fill-opacity", 1);

            const nodeExit = node.exit().transition(transition)
                .attr("transform", d => `translate(${source.y}, ${source.x})`)
                .remove();

            nodeExit.select("circle")
                .attr("r", 1e-6);

            nodeExit.select("text")
                .style("fill-opacity", 1e-6);

            const link = g.selectAll("path.link")
                .data(links, d => d.target.id);

            const linkEnter = link.enter().insert("path", "g")
                .attr("class", "link")
                .attr("d", d => {
                    const o = {x: source.x0, y: source.y0};
                    return diagonal(o, o);
                });

            const linkUpdate = link.merge(linkEnter).transition(transition)
                .attr("d", d => diagonal(d.source, d.target));

            const linkExit = link.exit().transition(transition)
                .attr("d", d => {
                    const o = {x: source.x, y: source.y};
                    return diagonal(o, o);
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });

            function diagonal(s, t) {
                return `M ${s.y} ${s.x}
                        C ${(s.y + t.y) / 2} ${s.x},
                          ${(s.y + t.y) / 2} ${t.x},
                          ${t.y} ${t.x}`;
            }
        }
